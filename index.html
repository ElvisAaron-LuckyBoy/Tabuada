<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <main>
        <section class="container">
            <h1>Central da Tabuada</h1>
            <input type="number" id="numero" placeholder="Digite um número">
            <button onclick="gerarTabuada()">
                Gerar Tabuada
            </button>
            <div id="resultado"></div>
        </section>
        <section class="container">
            <h1>Matrizes</h1>
            <button onclick="MostrarAlunos()">
                Mostrar alunos
            </button>
            <div id="alunos"></div> 
        </section>
    </main>

</body>

<script src="JavaScript/javascript.js"></script>
</html>
